<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b6939">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Талаа Farm Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one phone-width column (max 440px), fixed bottom tab bar with a raised "add" button; centered on desktop */
:root{
  --bg:#e7ece3; --surface:#fbfcf9; --sunk:#eff3ec; --ink:#17231a; --muted:#56655a; --line:#d2dacd;
  --accent:#2b6939; --accent-ink:#ffffff; --accent-soft:#dcebdc;
  --wheat:#b8820f; --wheat-soft:#f5e8c8;
  --good:#2a7a46; --bad:#ad4129; --warn:#9c6510;
  --display:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1511; --surface:#18201a; --sunk:#131a15; --ink:#e5ece4; --muted:#98a79b; --line:#29342c;
  --accent:#74c383; --accent-ink:#0d1a10; --accent-soft:#1f3324;
  --wheat:#e4b54a; --wheat-soft:#33290f;
  --good:#71cf8d; --bad:#ec8b72; --warn:#e2ad55; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f1511; --surface:#18201a; --sunk:#131a15; --ink:#e5ece4; --muted:#98a79b; --line:#29342c;
  --accent:#74c383; --accent-ink:#0d1a10; --accent-soft:#1f3324;
  --wheat:#e4b54a; --wheat-soft:#33290f;
  --good:#71cf8d; --bad:#ec8b72; --warn:#e2ad55; color-scheme:dark;}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:0}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:440px;margin:0 auto;min-height:100%;padding:0 16px 120px;position:relative}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;font-weight:600}
h1{font-size:24px;line-height:1.15}
h2{font-size:17px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}

/* top bar */
.top{display:flex;align-items:center;gap:10px;padding:14px 0 10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.top .who{flex:1;min-width:0}
.top .who b{font-family:var(--display);font-size:17px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 11px;font-weight:600;font-size:13px}
.iconbtn svg{width:18px;height:18px}
.back{border:0;background:none;padding:6px 6px 6px 0;display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-weight:600}

.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.section{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.row{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.row > *:first-child{min-width:0}
.kv{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line)}
.kv .row{padding:9px 0;border-bottom:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--sunk);border-radius:10px;padding:10px 12px}
.tile .v{font-family:var(--display);font-size:18px;font-weight:600;margin-top:2px}
.neg{color:var(--bad)} .pos{color:var(--good)}

/* field card on home */
.fcard{display:flex;flex-direction:column;gap:10px;text-align:left;width:100%}
.fhead{display:flex;align-items:center;gap:10px}
.cropdot{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.cropdot svg{width:20px;height:20px}
.fhead .t{flex:1;min-width:0}
.fhead .t b{display:block;font-family:var(--display);font-weight:600;font-size:16px}
.facts{display:grid;grid-template-columns:1fr;gap:6px;font-size:14px}
.fact{display:flex;gap:8px;align-items:flex-start}
.fact svg{width:16px;height:16px;flex:none;margin-top:2px;color:var(--muted)}
.fact.task svg{color:var(--accent)} .fact.rain svg{color:#3f7fb0}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.pill.ex{background:var(--wheat-soft);color:var(--wheat)}
.pill.low{background:var(--accent-soft);color:var(--good)}
.pill.mid{background:var(--wheat-soft);color:var(--warn)}
.pill.high{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}

.bigbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);padding:15px;font-weight:700;font-size:16px;font-family:var(--display)}
.bigbtn svg{width:20px;height:20px}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;font-weight:600;width:100%}
.danger{color:var(--bad)}

/* price card */
.price .bignum{font-family:var(--display);font-size:30px;font-weight:600;line-height:1}
.chg{font-weight:700}
.src{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}

/* onboarding */
.onb{padding-top:40px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:44px;height:44px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.brand .mark svg{width:26px;height:26px}
.brand b{font-family:var(--display);font-size:26px}
.langbtn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:16px}
.langbtn .code{font-family:var(--display);font-weight:700;width:42px;height:42px;border-radius:10px;display:grid;place-items:center;background:var(--sunk);flex:none}
.langbtn b{display:block;font-size:17px}
.langbtn.on{border-color:var(--accent);background:var(--accent-soft)}
.langbtn.on .code{background:var(--accent);color:var(--accent-ink)}

/* forms */
.fld{display:flex;flex-direction:column;gap:6px}
.fld > span{font-size:13px;font-weight:600;color:var(--muted)}
.inp{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 13px;font-size:16px}
.inp:focus{border-color:var(--accent);outline:none}
.inp.big{font-family:var(--display);font-size:26px;font-weight:600;padding:12px 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 13px;font-weight:600;font-size:14px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:9px 6px;font-weight:600;font-size:14px}
.seg button.on{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.check{display:flex;align-items:center;gap:10px;font-weight:500}
.check input{width:20px;height:20px;accent-color:var(--accent)}

/* add types */
.types{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.type{display:flex;flex-direction:column;align-items:flex-start;gap:10px;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;text-align:left;font-weight:600;font-size:15px}
.type .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--sunk);color:var(--accent)}
.type .ic svg{width:21px;height:21px}
.type.sale .ic,.type.harvest .ic{color:var(--wheat);background:var(--wheat-soft)}

/* timeline */
.tl{display:flex;flex-direction:column}
.tli{display:grid;grid-template-columns:62px 22px 1fr;gap:0 8px;align-items:start}
.tli .d{font-size:13px;color:var(--muted);padding-top:2px;font-variant-numeric:tabular-nums}
.tli .rail{display:flex;flex-direction:column;align-items:center;align-self:stretch}
.tli .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);margin-top:6px;flex:none}
.tli .ln{width:2px;flex:1;background:var(--line);margin:2px 0}
.tli:last-child .ln{visibility:hidden}
.tli .body{padding-bottom:14px;min-width:0}
.tli .body b{font-weight:600}
.tli img{display:block;width:120px;height:90px;object-fit:cover;border-radius:8px;margin-top:6px}

/* chart */
.chartwrap{overflow-x:auto}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-size:10px;font-family:var(--body)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
table.mm{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.mm th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:right;font-weight:600;padding:6px 0}
table.mm th:first-child,table.mm td:first-child{text-align:left}
table.mm td{text-align:right;padding:8px 0;border-top:1px solid var(--line)}

/* compare bars */
.cmp{display:flex;flex-direction:column;gap:14px}
.cmpi .bar{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden;margin:6px 0 4px}
.cmpi .bar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.range{font-family:var(--display);font-weight:600;font-size:17px}
.note{background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:14px}
.empty{text-align:center;padding:26px 14px;color:var(--muted)}
.empty svg{width:34px;height:34px;margin-bottom:6px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;padding-bottom:env(safe-area-inset-bottom,0px);pointer-events:none}
.tabs nav{pointer-events:auto;max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px 8px}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--accent)}
.tab.plus .c{width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-26px;box-shadow:0 4px 14px rgba(20,60,30,.3);border:4px solid var(--bg)}
.tab.plus .c svg{width:26px;height:26px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,20,12,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:440px;border-radius:20px 20px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:88vh;overflow-y:auto}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;z-index:60;font-size:14px;display:flex;gap:8px;align-items:center}
.toast svg{width:18px;height:18px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}.toast{animation:fade .2s ease-out}}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
@keyframes fade{from{opacity:0;transform:translate(-50%,8px)}}
</style>

const T=(k,v={})=>{let s=(L[st.lang||'ru'][k]);if(s==null)s=L.ru[k]??k;if(typeof s==='string')for(const x in v)s=s.split('{'+x+'}').join(v[x]);return s};

const nf=(n,d=0)=>new Intl.NumberFormat(LOCALE[st.lang||'ru'],{maximumFractionDigits:d,minimumFractionDigits:0}).format(n);
const curS=()=>D().cur[st.farm.currency];
function money(n,short){
  const c=curS(), neg=n<0, a=Math.abs(n);
  let body = short&&a>=1e6 ? `${nf(a/1e6,2)} ${T('mln')}` : nf(a);
  body = st.farm.currency==='usd' ? `$${body}` : `${body} ${c}`;
  return (neg?'−':'')+body;
}
function area(ha){return st.farm.unit==='sot'?`${nf(ha*100)} ${T('sot')}`:`${nf(ha,2)} ${T('ha')}`}
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const todayIso=()=>iso(new Date());
const diffDays=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
function rel(s){const n=diffDays(s,todayIso());if(n===0)return T('todayW');if(n===1)return T('yesterday');if(n===-1)return T('tomorrow');return n>0?T('daysAgo',{n}):T('inDays',{n:-n})}
function shortDate(s){const d=parse(s);return `${d.getDate()} ${D().months[d.getMonth()]}`}

/* ---------- calculations ---------- */
const recsOf=fid=>st.records.filter(r=>r.fieldId===fid).sort((a,b)=>a.date.localeCompare(b.date));
function fin(fid){
  const rs=recsOf(fid);let spent=0,kg=0,sold=0;
  rs.forEach(r=>{if(COST_TYPES.includes(r.type))spent+=+r.amount||0;if(r.type==='harvest')kg+=+r.kg||0;if(r.type==='sale')sold+=+r.amount||0});
  return {spent,kg,sold,result:sold-spent,last:rs[rs.length-1]};
}
function priceStats(c){
  const s=MARKET[c];if(!s)return null;
  let i=s.length-1;while(i>=0&&s[i]==null)i--;if(i<0)return null;
  const now=s[i],prev=s[i-12]??null;
  return {now,prev,chg:prev?((now-prev)/prev*100):null,idx:i};
}
const idxLabel=i=>{const m=(PRICE_START.m+i)%12,y=PRICE_START.y+Math.floor((PRICE_START.m+i)/12);return {m,y}};

function chart(c){
  const s=MARKET[c],own=OWN[c]||{};const n=s.length;
  const W=360,H=200,pl=30,pr=8,pt=10,pb=26;
  const vals=s.filter(v=>v!=null).concat(Object.values(own));
  let lo=Math.min(...vals),hi=Math.max(...vals);const pad=(hi-lo)*.12||5;lo=Math.floor((lo-pad)/5)*5;hi=Math.ceil((hi+pad)/5)*5;
  const x=i=>pl+(W-pl-pr)*i/(n-1),y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  const step=(hi-lo)/4;let g='';
  for(let k=0;k<=4;k++){const v=lo+step*k;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-5}" y="${y(v)+3}" text-anchor="end">${nf(v)}</text>`}
  let xl='';for(let i=0;i<n;i++){const {m,y:yy}=idxLabel(i);if(m===0){xl+=`<line x1="${x(i)}" x2="${x(i)}" y1="${pt}" y2="${H-pb}" stroke="var(--line)" stroke-dasharray="2 3"/><text x="${x(i)+3}" y="${H-8}">${yy}</text>`}}
  let d='',on=false;s.forEach((v,i)=>{if(v==null){on=false;return}d+=(on?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1);on=true});
  let area='';{let seg=[];const flush=()=>{if(seg.length>1){area+=`<path d="M${seg[0][0]} ${H-pb} ${seg.map(p=>'L'+p[0]+' '+p[1]).join(' ')} L${seg[seg.length-1][0]} ${H-pb}Z" fill="var(--accent)" opacity=".08"/>`}seg=[]};
    s.forEach((v,i)=>{if(v==null){flush();return}seg.push([x(i).toFixed(1),y(v).toFixed(1)])});flush();}
  const last=priceStats(c).idx;
  const dots=Object.entries(own).map(([i,v])=>`<circle cx="${x(+i)}" cy="${y(v)}" r="4.5" fill="var(--wheat)" stroke="var(--surface)" stroke-width="2"/>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${T('marketAvg')}">${g}${xl}${area}<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>${dots}
   <circle cx="${x(last)}" cy="${y(s[last])}" r="4" fill="var(--accent)"/><text x="${Math.min(x(last),W-pr-14)}" y="${y(s[last])-9}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${nf(s[last])}</text></svg>`;
}

      <div class="src">${ic('info')}<span>${esc(D().regions[st.farm.region])} · ${T('source')}: ${T('sampleSrc')}</span></div>

      ${Object.entries(yrs).map(([y,a])=>`<tr><td>${y}</td><td>${nf(Math.min(...a))}</td><td>${nf(a.reduce((p,q)=>p+q,0)/a.length,1)}</td><td>${nf(Math.max(...a))}</td></tr>`).join('')}

    body=`<h2>${T('settings')}</h2>
      <div class="fld"><span>${T('language')}</span><div class="seg">${['ky','ru','en'].map(l=>`<button data-act="setLangKeep" data-v="${l}" class="${st.lang===l?'on':''}">${L[l].name}</button>`).join('')}</div></div>
      <label class="fld"><span>${T('farmName')}</span><input class="inp" id="st-name" value="${esc(st.farm.name)}"></label>
      <label class="fld"><span>${T('region')}</span><select class="inp" id="st-region">${Object.entries(D().regions).map(([k,v])=>`<option value="${k}" ${st.farm.region===k?'selected':''}>${v}</option>`).join('')}</select></label>
      <div class="fld"><span>${T('units')}</span><div class="seg">${['ha','sot'].map(u=>`<button data-act="setUnitKeep" data-v="${u}" class="${st.farm.unit===u?'on':''}">${u==='ha'?T('unitHa'):T('unitSot')}</button>`).join('')}</div></div>
      <button class="bigbtn" data-act="saveSettings">${T('save')}</button>
      <button class="ghost danger" data-act="reset">${ui.resetArm?T('resetConfirm'):T('reset')}</button>`;
  } else if(ui.sheet==='addField'){
    const firstCrop=st.crops[0]||'potato';
    body=`<h2>${T('addField')}</h2>
      <label class="fld"><span>${T('fieldName')}</span><input class="inp" id="nf-name" placeholder="Ак-Суу 3"></label>
      <label class="fld"><span>${T('area')}, ${st.farm.unit==='sot'?T('sot'):T('ha')}</span><input class="inp num" id="nf-area" inputmode="decimal" placeholder="0"></label>
      <label class="fld"><span>${T('crop')}</span><select class="inp" id="nf-crop">${CROPS.map(c=>`<option value="${c}" ${c===firstCrop?'selected':''}>${cropName(c)}</option>`).join('')}</select></label>
      <label class="fld"><span>${T('planted')}</span><input class="inp" type="date" id="nf-date" value="${todayIso()}"></label>
      <label class="fld"><span>${T('variety')}</span><input class="inp" id="nf-var" placeholder="${T('notePh')}"></label>
      <button class="bigbtn" data-act="saveField">${T('save')}</button>`;
  }
  return `<div class="scrim" data-act="closeSheet"><div class="sheet" data-stop="1"><div class="grab"></div>${body}</div></div>`;
}

/* ---------- render ---------- */
function render(){
  document.documentElement.lang=st.lang==='ky'?'ky':(st.lang||'ru');
  const v=ui.view;
  const html= v==='onb1'?vOnb1(): v==='onb2'?vOnb2(): v==='home'?vHome(): v==='fields'?vFields(): v==='field'?vField(): v==='add'?vAdd(): v==='prices'?vPrices(): vAn();
  document.getElementById('app').innerHTML=html;
  const onb=v.startsWith('onb');
  const tab=v==='field'?'fields':v;
  document.getElementById('tabs').innerHTML=onb?'':`<nav>${[['home','home'],['fields','fields'],['add','plus'],['prices','prices'],['an','an']].map(([k,i])=>
    k==='add'?`<button class="tab plus ${tab==='add'?'on':''}" data-act="go" data-v="add"><span class="c">${ic('plus')}</span>${T('t_add')}</button>`
    :`<button class="tab ${tab===k?'on':''}" data-act="go" data-v="${k}">${ic(i)}${T('t_'+k)}</button>`).join('')}</nav>`;
  document.getElementById('layer').innerHTML=sheet()+(ui.toast?`<div class="toast">${ic('check')}${esc(ui.toast)}</div>`:'');
  const ph=document.getElementById('a-photo');if(ph)ph.addEventListener('change',onPhoto);
  const ad=document.getElementById('a-date');if(ad)ad.addEventListener('change',e=>{ui.addDate=e.target.value;});
}
function toast(m){ui.toast=m;render();clearTimeout(toast.t);toast.t=setTimeout(()=>{ui.toast=null;render()},1800)}
function go(v){ui.view=v;ui.sheet=null;if(v==='add'){ui.addType=null;ui.photo=null;ui.addDate=null}window.scrollTo(0,0);render()}

function onPhoto(e){
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{const s=Math.min(1,320/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);ui.photo=c.toDataURL('image/jpeg',.72);render()};img.src=rd.result};rd.readAsDataURL(f);
}
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():''};
const numv=id=>{const s=val(id).replace(/\s/g,'').replace(',','.');const n=parseFloat(s);return isFinite(n)?n:0};

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  if(el.dataset.act==='closeSheet'&&e.target.closest('[data-stop]'))return;
  const a=el.dataset.act,v=el.dataset.v;
  switch(a){
    case 'pickLang': st.lang=v;save();ui.view='onb2';render();break;
    case 'go': go(v);break;
    case 'setCur': st.farm.name=val('s-name');st.farm.region=val('s-region')||st.farm.region;st.sample=document.getElementById('s-sample').checked;st.farm.currency=v;render();break;
    case 'setUnit': st.farm.name=val('s-name');st.farm.region=val('s-region')||st.farm.region;st.sample=document.getElementById('s-sample').checked;st.farm.unit=v;render();break;
    case 'toggleCrop': st.farm.name=val('s-name');st.farm.region=val('s-region')||st.farm.region;st.sample=document.getElementById('s-sample').checked;
      st.crops=st.crops.includes(v)?st.crops.filter(c=>c!==v):[...st.crops,v];render();break;
    case 'finishSetup': st.farm.name=val('s-name')||'Ак-Суу';st.farm.region=val('s-region');st.sample=document.getElementById('s-sample').checked;
      if(st.sample)seed();st.setup=true;save();go('home');break;
    case 'sheet': ui.sheet=v;ui.resetArm=false;render();break;
    case 'closeSheet': ui.sheet=null;render();break;
    case 'setLang': st.lang=v;save();ui.sheet=null;render();break;
    case 'setLangKeep': st.lang=v;save();render();break;
    case 'setUnitKeep': st.farm.unit=v;save();render();break;
    case 'saveSettings': st.farm.name=val('st-name')||st.farm.name;st.farm.region=val('st-region');save();ui.sheet=null;toast('✓ '+st.farm.name);break;
    case 'reset': if(!ui.resetArm){ui.resetArm=true;render();break}
      const lang=st.lang;st=fresh();st.lang=lang;save();ui={...ui,view:'onb2',sheet:null,resetArm:false};render();break;
    case 'openField': ui.fieldId=v;go('field');break;
    case 'openPrices': ui.priceCrop=v;go('prices');break;
    case 'priceCrop': ui.priceCrop=v;render();break;
    case 'anCrop': ui.anCrop=v;render();break;
    case 'addFor': ui.addField=v;go('add');ui.addField=v;render();break;
    case 'addType': ui.addType=v||null;ui.photo=null;render();break;
    case 'addField': ui.addField=v;render();break;
    case 'addDate': ui.addDate=v;render();break;
    case 'saveRec': {
      const t=ui.addType;const rec={id:uid(),fieldId:ui.addField,type:t,date:val('a-date')||todayIso()};
      if(document.getElementById('a-amount'))rec.amount=numv('a-amount');
      if(document.getElementById('a-kg'))rec.kg=numv('a-kg');
      const note=val('a-note');if(note)rec.note=note;if(ui.photo)rec.img=ui.photo;
      st.records.push(rec);save();const fid=ui.addField;ui.fieldId=fid;ui.addType=null;ui.photo=null;ui.addDate=null;ui.view='field';window.scrollTo(0,0);toast(T('saved'));break;}
    case 'saveField': {
      const name=val('nf-name');let ar=numv('nf-area');if(!name||!ar){const i=document.getElementById(!name?'nf-name':'nf-area');i.focus();i.style.borderColor='var(--bad)';break}
      if(st.farm.unit==='sot')ar=ar/100;
      st.fields.push({id:uid(),name,area:ar,crop:val('nf-crop'),planted:val('nf-date')||todayIso(),variety:val('nf-var')});
      if(!st.crops.includes(val('nf-crop')))st.crops.push(val('nf-crop'));
      save();ui.sheet=null;toast('✓ '+name);break;}
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.sheet){ui.sheet=null;render()}});
render();
</script>

</body>
</html>
